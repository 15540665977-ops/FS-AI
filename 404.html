<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>汽车及智能穿戴材料学习平台</title>
  <script>
    // GitHub Pages SPA 路由：把路径编码到查询参数，由 index.html 还原
    var l = window.location;
    l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 2).join('/') +
      '/?p=' + encodeURIComponent(l.pathname.slice(1) + l.search) +
      l.hash);
  </script>
</head>
<body></body>
</html>
